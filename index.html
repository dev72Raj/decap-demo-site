<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f4f4f4; color: #333; }
    header {
      background: #1a1a2e;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    header h1 { font-size: 2rem; letter-spacing: 1px; }
    header a {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 20px;
      background: #e94560;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 0.85rem;
    }
    main { max-width: 760px; margin: 40px auto; padding: 0 20px; }
    .post {
      background: white;
      border-radius: 8px;
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .post h2 { font-size: 1.5rem; color: #1a1a2e; margin-bottom: 12px; }
    .post-body { line-height: 1.8; color: #555; }
    #status {
      text-align: center;
      color: #999;
      font-family: sans-serif;
      padding: 50px 0;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Blog</h1>
    <a href="/admin/">&#9998; Go to CMS</a>
  </header>

  <main>
    <div id="posts">
      <div id="status">Loading posts...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function parseFrontmatter(raw) {
      const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (!match) return { title: 'Untitled', body: raw };
      const data = {};
      match[1].split('\n').forEach(line => {
        const i = line.indexOf(':');
        if (i === -1) return;
        data[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      });
      return { title: data.title || 'Untitled', body: match[2].trim() };
    }

    async function loadPosts() {
      const container = document.getElementById('posts');
      const status = document.getElementById('status');

      try {
        const res = await fetch('http://localhost:8081/api/v1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'entriesByFolder',
            params: {
              branch: 'main',
              folder: 'posts',
              extension: 'md',
              depth: 1
            }
          })
        });

        if (!res.ok) throw new Error('Proxy error: ' + res.status);

        const json = await res.json();
        const entries = Array.isArray(json) ? json : (json.entries || []);

        if (entries.length === 0) {
          status.textContent = 'No posts yet. Create one in the CMS!';
          return;
        }

        container.innerHTML = '';
        entries.forEach(entry => {
          const { title, body } = parseFrontmatter(entry.data || '');
          const div = document.createElement('div');
          div.className = 'post';
          div.innerHTML = `
            <h2>${title}</h2>
            <div class="post-body">${marked.parse(body)}</div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        status.innerHTML = `
          <b>Proxy server not running.</b><br><br>
          Start it with: <code>npx decap-server</code><br>
          then refresh this page.
        `;
      }
    }

    loadPosts();
  </script>

</body>
</html>
